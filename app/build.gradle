plugins {
    id 'com.android.application'
}

android {
    namespace 'com.prueba.imprimir'
    compileSdk 35

    defaultConfig {
        applicationId 'com.prueba.imprimir'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Firma con la llave de debug para poder instalarla directo en el quiosco.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
